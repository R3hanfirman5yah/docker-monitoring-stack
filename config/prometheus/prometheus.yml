global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'monitoring-stack'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - 'alert.rules'

scrape_configs:
  # Prometheus Self-Monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter - System Metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: 'ubuntu-server'
          group: 'servers'

  # cAdvisor - Container Metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          instance: 'docker-host'
          group: 'containers'

  # Loki - Log Metrics
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
        labels:
          group: 'logging'

  # Grafana - Application Metrics
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
        labels:
          group: 'applications'
